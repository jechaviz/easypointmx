# Easypoint en nginx + php-fpm (alternativa a Apache/cPanel). El único PHP es shim.php, que ejecuta el binario CGI de V.
server {
  listen 80;
  server_name easypoint.mx www.easypoint.mx;
  root /var/www/easypoint;               # contiene website/ app/ shared/ vendor/ runtime-config.js shim.php
  client_max_body_size 4m;

  location = / { return 302 /website/; }

  location /api/ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root/shim.php;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param HTTP_X_API_KEY $http_x_api_key;
    fastcgi_read_timeout 30s;
  }

  # SPA: rutas sin archivo caen al index de su sección
  location /website/ { try_files $uri $uri/ /website/index.html; }
  location /app/     { try_files $uri $uri/ /app/index.html; }

  # nada de código ni secretos por la web
  location ~* \.(env|sql|v|sh|md)$ { deny all; }
  location ~ /\. { deny all; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
