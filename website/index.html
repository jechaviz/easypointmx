<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Easypoint · Tu ciudad, a un punto de distancia</title>
  <meta name="description" content="Recibe paquetes, envía con DHL y Estafeta, paga servicios y reserva excursiones con apartado desde $100 en el punto Easypoint más cercano.">
  <meta name="theme-color" content="#84cc16">
  <meta property="og:title" content="Easypoint · Tu ciudad, a un punto de distancia">
  <meta property="og:description" content="Paquetes, guías, servicios y excursiones con apartado, en una red de puntos cerca de ti.">
  <meta property="og:type" content="website">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../shared/ep-ui.css">
  <script>
    // Redirección de enlaces profundos (404.html → ?redirect=/ruta) y tema antes del primer pintado
    (function () {
      try {
        var r = new URLSearchParams(location.search).get('redirect');
        if (r) history.replaceState(null, '', location.pathname.replace(/\/$/, '') + '/#' + decodeURIComponent(r));
        var t = localStorage.getItem('ep-theme');
        if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__epInstall = e; window.dispatchEvent(new Event('ep-installable')); });
      if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    })();
  </script>
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"Easypoint","description":"Red de puntos para recibir paquetes, enviar guías, pagar servicios y reservar excursiones.","areaServed":"MX"}</script>
</head>
<body>
  <div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#64748b">Cargando Easypoint…</div></div>
  <noscript><p style="padding:24px;font-family:system-ui">Easypoint necesita JavaScript. También puedes escribirnos por WhatsApp.</p></noscript>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.js"></script>
  <script src="../runtime-config.js"></script>
  <script src="../runtime-config.generated.js" onerror="void 0"></script>
  <script src="../vendor/web-common/browser.js"></script>
  <script src="../vendor/procurement-common/browser.js"></script>
  <script src="../shared/ep-art.js"></script>
  <script src="../shared/ep-core.js"></script>
  <script>
    EP.boot({
      base: './components/',
      shell: './components/Shell.vue',
      notFound: { path: '*', name: 'notfound', comp: 'pages/NotFound.vue', title: 'No encontrada' },
      routes: [
        { path: '/', name: 'home', comp: 'pages/Home.vue', title: 'Tu ciudad, a un punto de distancia' },
        { path: '/excursiones', name: 'excursiones', comp: 'pages/Excursiones.vue', title: 'Excursiones con apartado' },
        { path: '/excursion/:id', name: 'excursion', comp: 'pages/Excursion.vue', title: 'Reserva tu excursión' },
        { path: '/voucher', name: 'voucher', comp: 'pages/Voucher.vue', title: 'Mi voucher' },
        { path: '/envia', name: 'envia', comp: 'pages/Envia.vue', title: 'Envía con DHL y Estafeta' },
        { path: '/rastreo', name: 'rastreo', comp: 'pages/Rastreo.vue', title: 'Rastrea tu paquete' },
        { path: '/puntos', name: 'puntos', comp: 'pages/Puntos.vue', title: 'Puntos Easypoint' },
        { path: '/servicios', name: 'servicios', comp: 'pages/Servicios.vue', title: 'Servicios en tu punto' },
        { path: '/club', name: 'club', comp: 'pages/Club.vue', title: 'Easypoint Club' },
        { path: '/afiliate', name: 'afiliate', comp: 'pages/Afiliate.vue', title: 'Afíliate: puntos, proveedores y e-commerce' },
        { path: '/ayuda', name: 'ayuda', comp: 'pages/Ayuda.vue', title: 'Ayuda' },
        { path: '/legal/:doc', name: 'legal', comp: 'pages/Legal.vue', title: 'Legal' },
        { path: '/descargar', name: 'descargar', comp: 'pages/Descargar.vue', title: 'Instala la app' }
      ]
    });
  </script>
</body>
</html>
