<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Easypoint</title>
  <!--
    Fallback SPA para hosting estático (GitHub Pages, etc.): cualquier deep-link
    desconocido (p.ej. /website/guias abierto en pestaña nueva o recargado) se
    redirige al index del SPA correspondiente preservando la ruta en ?redirect=,
    y el index la restaura con history.replaceState. En el modelo Node/nginx este
    archivo nunca se usa (el servidor ya hace fallback a index.html).
  -->
  <script>
    (function () {
      var l = window.location;
      var path = l.pathname;
      var seg = (path.indexOf('/app/') >= 0 || /\/app$/.test(path)) ? 'app' : 'website';
      var marker = '/' + seg;
      var idx = path.indexOf(marker);
      var base = idx >= 0 ? path.slice(0, idx) : '';
      var sub = idx >= 0 ? path.slice(idx + marker.length) : '';
      if (!sub || sub === '/') {
        l.replace(base + marker + '/');
      } else {
        l.replace(base + marker + '/?redirect=' + encodeURIComponent(sub + l.search + l.hash));
      }
    })();
  </script>
</head>
<body></body>
</html>
