<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Easypoint · Panel de trabajo</title>
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../website/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../website/icon.svg">
  <link rel="stylesheet" href="../shared/ep-ui.css">
  <script>
    (function () {
      try { var t = localStorage.getItem('ep-theme'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__epInstall = e; window.dispatchEvent(new Event('ep-installable')); });
      if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    })();
  </script>
</head>
<body>
  <div id="app"><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui;color:#64748b">Cargando panel…</div></div>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.js"></script>
  <script src="../runtime-config.js"></script>
  <script src="../runtime-config.generated.js" onerror="void 0"></script>
  <script src="../vendor/web-common/browser.js"></script>
  <script src="../shared/ep-art.js"></script>
  <script src="../shared/ep-core.js"></script>
  <script>
    // Cada rol ve su propio "Hoy" y su propio menú; las rutas se protegen en el servidor (esto es sólo UX).
    const R = (path, comp, title, roles) => ({ path, name: path, comp: 'pages/' + comp + '.vue', title, roles });
    const routes = [
      R('/login', 'Login', 'Entrar'), R('/reset', 'Reset', 'Nueva contraseña'), R('/setup', 'Setup', 'Configuración inicial'),
      R('/', 'Hoy', 'Hoy'), R('/perfil', 'Perfil', 'Mi perfil'),
      R('/cobrar', 'Cobrar', 'Cobrar abono', ['operator', 'admin']), R('/vender', 'Vender', 'Vender', ['operator', 'admin']),
      R('/paquetes', 'Paquetes', 'Paquetes', ['operator', 'admin']), R('/caja', 'Caja', 'Mi caja', ['operator']),
      R('/ruta', 'Ruta', 'Ruta del día', ['driver', 'admin']),
      R('/salidas', 'Salidas', 'Salidas', ['provider', 'admin']), R('/excursiones', 'Excursiones', 'Excursiones', ['provider', 'admin']),
      R('/liquidaciones', 'Liquidaciones', 'Liquidaciones', ['provider', 'admin']),
      R('/reservas', 'Reservas', 'Reservas', ['admin', 'support', 'provider']), R('/clientes', 'Clientes', 'Clientes', ['admin', 'support', 'sales']),
      R('/economia', 'Economia', 'Economía', ['admin']), R('/efectivo', 'Efectivo', 'Efectivo', ['admin']),
      R('/aspirantes', 'Aspirantes', 'Aspirantes', ['admin', 'sales']), R('/campanas', 'Campanas', 'Campañas', ['admin', 'sales']),
      R('/tickets', 'Tickets', 'Tickets', ['admin', 'support']), R('/bandeja', 'Bandeja', 'Bandeja de salida', ['admin', 'support', 'sales']),
      R('/riesgo', 'Riesgo', 'Riesgo', ['admin']), R('/automatizacion', 'Automatizacion', 'Automatización', ['admin']),
      R('/admin/:res', 'Recurso', 'Administración', ['admin', 'sales'])
    ];
    EP.boot({
      base: './components/', shell: './components/Shell.vue',
      notFound: { path: '*', name: 'nf', comp: 'pages/NotFound.vue', title: 'No encontrada' },
      routes,
      guard(route) {
        if (route.name === '/setup') return null; // el asistente decide: crea el primer admin o exige serlo
        if (route.name === '/login' || route.name === '/reset') return EP.session.token ? '/' : null;
        if (!EP.session.token) return '/login';
        if (route.roles && !EP.isRole(...route.roles)) return '/';
        return null;
      }
    });
  </script>
</body>
</html>
