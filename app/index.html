<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SPA deep-link restore: 404.html redirige aquí con ?redirect=/ruta -->
    <script>
      (function () {
        try {
          var r = new URLSearchParams(window.location.search).get('redirect');
          if (r) window.history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + decodeURIComponent(r));
        } catch (e) {}
      })();
    </script>
    <title>Easypoint Logistics OOH</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Tailwind CSS (Play CDN for Nodeless) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f7fee7',
                            100: '#ecfccb',
                            200: '#d9f99d',
                            300: '#bef264',
                            400: '#a3e635', // Neon Lime
                            500: '#84cc16',
                            600: '#65a30d',
                            900: '#365314',
                        },
                        slate: {
                            850: '#151e32',
                            900: '#0f172a', // Primary dark
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Base Styles & Utilities */
        body {
            background-color: #f8fafc; /* slate-50 */
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .glass-panel-dark {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Vue Transitions */
        .page-enter-active,
        .page-leave-active {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .page-enter-from,
        .page-leave-to {
            opacity: 0;
            transform: translateY(10px);
        }
        
        /* Hide scrollbar for clean horizontal lists */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="selection:bg-brand-400 selection:text-slate-900">
    <div id="app"></div>

    <!-- Vue 3 (Global build) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- vue3-sfc-loader -->
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
    <!-- Public runtime config -->
    <script src="../runtime-config.js"></script>
    <script>
        function loadOptionalScript(src, done) {
            const script = document.createElement('script');
            script.src = src;
            script.async = false;
            script.onload = done;
            script.onerror = done;
            document.head.appendChild(script);
        }

        function bootApp() {
            let booted = false;
            function startMainApp() {
                if (booted) return;
                booted = true;

                window.OneSignalDeferred = window.OneSignalDeferred || [];

                const oneSignal = document.createElement('script');
                oneSignal.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
                oneSignal.defer = true;
                document.body.appendChild(oneSignal);

                const main = document.createElement('script');
                main.src = 'main.js';
                document.body.appendChild(main);
            }

            const pushConfig = document.createElement('script');
            pushConfig.src = 'push-config.js';
            pushConfig.onload = startMainApp;
            pushConfig.onerror = startMainApp;
            document.head.appendChild(pushConfig);
        }

        loadOptionalScript('../runtime-config.generated.js', () => {
            loadOptionalScript('../runtime-config.local.js', bootApp);
        });
    </script>
</body>
</html>
