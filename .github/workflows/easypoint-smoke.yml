name: Easypoint Smoke

on:
  push:
    paths:
      - 'app/**'
      - 'website/**'
      - 'pb/**'
      - 'scripts/**'
      - 'tests/**'
      - 'runtime-config*.js'
      - '.github/workflows/easypoint-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'website/**'
      - 'pb/**'
      - 'scripts/**'
      - 'tests/**'
      - 'runtime-config*.js'
      - '.github/workflows/easypoint-smoke.yml'

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run smoke stack
        run: node scripts/local-stack.mjs smoke
